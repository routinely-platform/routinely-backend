server:
  port: 8083

spring:
  application:
    name: challenge-service
  grpc:
    server:
      port: 9083
    client:
      channels:
        routine-service:
          address: "static://${ROUTINE_SERVICE_HOST:routine-service}:${ROUTINE_SERVICE_GRPC_PORT:9082}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/challenge_db
    username: ${DB_USERNAME:routinely}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

gateway:
  secret: ${GATEWAY_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry-service:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      # challenge → routine 카테고리 조회 gRPC 호출 보호
      routine-service-cb:
        baseConfig: default
  timelimiter:
    configs:
      default:
        # gRPC deadline(3s)이 먼저 끊도록 backstop은 더 길게 둔다
        timeoutDuration: 5s
    instances:
      routine-service-cb:
        baseConfig: default

# 파일 저장(S3) — 챌린지 대표 이미지 업로드용 (#142)
routinely:
  storage:
    s3:
      enabled: true
      bucket: ${S3_BUCKET:routinely-dev}
      region: ${S3_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
