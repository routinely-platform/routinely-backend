spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:challenge_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    # @KafkaListener 컨테이너가 브로커 연결을 시도해 컨텍스트 로드가 실패하지 않도록 테스트에서는 비활성화한다.
    listener:
      auto-startup: false

gateway:
  secret: test-gateway-secret

eureka:
  client:
    enabled: false
