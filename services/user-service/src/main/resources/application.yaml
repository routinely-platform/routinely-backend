server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/user_db
    username: ${DB_USERNAME:routinely}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

gateway:
  secret: ${GATEWAY_SECRET}

user:
  profile:
    nickname-cooldown-days: ${NICKNAME_COOLDOWN_DAYS:30}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry-service:8761/eureka/
  instance:
    prefer-ip-address: true

# 파일 저장(S3) — 프로필 사진 업로드용
routinely:
  storage:
    s3:
      enabled: true
      bucket: ${S3_BUCKET:routinely-dev}
      region: ${S3_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
