spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///user_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: routinely
    password: test
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1obWFjLXNoYTI1Ni1hbGdvcml0aG0h
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000
  refresh-cookie-secure: false

user:
  profile:
    nickname-cooldown-days: ${NICKNAME_COOLDOWN_DAYS:30}

eureka:
  client:
    enabled: false

# S3 는 기본 설정(bucket/region)으로 Bean 만 생성한다. 실제 업로드는 단위 테스트에서 mock 으로 검증하며
# 통합 컨텍스트에서는 네트워크 호출이 없어 안전하다.
routinely:
  storage:
    s3:
      enabled: true
      bucket: test-bucket
      region: ap-northeast-2
