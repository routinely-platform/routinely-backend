eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:registry-service}:8761/eureka/

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:30}
  refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
  # 기본값 없음 — 누락 · 빈 값이면 기동 실패. Nginx 1대 = 1. ADR-0003
  trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT}
  fail-open-on-redis-error: ${RATE_LIMIT_FAIL_OPEN_ON_REDIS_ERROR:false}

gateway:
  secret: ${GATEWAY_SECRET}

jwt:
  secret: ${JWT_SECRET}