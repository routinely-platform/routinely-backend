server:
  port: 8082

spring:
  application:
    name: routine-service
  grpc:
    server:
      port: 9082
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB # 5MB 사진 + multipart 헤더/메모 여유
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/routine_db
    username: ${DB_USERNAME:routinely}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    # Outbox 폴러는 트랜잭션·행 잠금 안에서 전송을 기다린다(#61). 브로커 장애 시 한 번의 폴링이 잠금을
    # 오래 잡지 않도록 대기 한도를 짧게 둔다. 기본값은 max.block 60s · delivery 120s다.
    # delivery.timeout.ms ≥ linger.ms + request.timeout.ms 제약을 지켜야 한다.
    producer:
      properties:
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry-service:8761/eureka/
  instance:
    prefer-ip-address: true

# 파일 저장(S3) — 루틴 수행 인증 사진 업로드 (#57). local 프로파일은 LocalStack을 사용한다.
routinely:
  storage:
    s3:
      enabled: true
      bucket: ${S3_BUCKET:routinely-dev}
      region: ${S3_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
