server:
  port: 8082

spring:
  application:
    name: routine-service
  grpc:
    server:
      port: 9082
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/routine_db
    username: ${DB_USERNAME:routinely}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry-service:8761/eureka/
  instance:
    prefer-ip-address: true

# 파일 저장(S3) — 루틴 수행 인증 사진 업로드 (#57). local 프로파일은 LocalStack을 사용한다.
routinely:
  storage:
    s3:
      enabled: true
      bucket: ${S3_BUCKET:routinely-dev}
      region: ${S3_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
