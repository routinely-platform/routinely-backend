spring:
  task:
    scheduling:
      enabled: false
  grpc:
    server:
      port: 0
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///routine_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: routinely
    password: test
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

# 테스트에서는 S3에 실제로 붙지 않는다 — S3Client 는 기동 시 자격증명을 지연 해석하므로 빈 생성만 검증된다.
routinely:
  storage:
    s3:
      enabled: true
      bucket: test-bucket
      region: ap-northeast-2
